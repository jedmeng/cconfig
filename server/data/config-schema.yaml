version: 1
properties:
  - key: port
    type: number
    description: HTTP(S) 代理监听端口
    default: 7890
    rules: &a1
      - kind: range
        min: 1
        max: 65535
  - key: socks-port
    type: number
    description: SOCKS5 代理监听端口
    default: 7891
    rules: *a1
  - key: mixed-port
    type: number
    description: HTTP(S) 与 SOCKS 混合代理端口
    default: 10801
    rules: *a1
  - key: redir-port
    type: number
    description: 透明代理端口（Linux / macOS）
    default: 7892
    rules: *a1
  - key: tproxy-port
    type: number
    description: TProxy 透明代理端口（Linux）
    default: 7893
    rules: *a1
  - key: allow-lan
    type: boolean
    description: 是否允许局域网设备连接代理
    default: true
  - key: bind-address
    type: string
    description: 允许局域网时绑定的监听地址
    default: "*"
  - key: authentication
    type: array
    items:
      type: string
    description: HTTP(S)/SOCKS/Mixed 代理的用户名密码认证
    default:
      - username:password
  - key: skip-auth-prefixes
    type: array
    items:
      type: string
    description: 允许跳过代理认证的 IP 段
    default:
      - 127.0.0.1/8
      - ::1/128
  - key: lan-allowed-ips
    type: array
    items:
      type: string
    description: 允许连接的 IP 段（allow-lan 为 true 时生效）
    default:
      - 0.0.0.0/0
      - ::/0
  - key: lan-disallowed-ips
    type: array
    items:
      type: string
    description: 禁止连接的 IP 段（优先级高于白名单）
    default:
      - 192.168.0.3/32
  - key: find-process-mode
    type: string
    description: 进程匹配模式（always / strict / off）
    default: strict
    enum:
      - always
      - strict
      - off
  - key: mode
    type: string
    description: 运行模式（rule 规则 / global 全局 / direct 直连）
    default: rule
    enum:
      - rule
      - global
      - direct
  - key: log-level
    type: string
    description: 内核日志输出级别
    default: debug
    enum:
      - silent
      - error
      - warning
      - info
      - debug
  - key: ipv6
    type: boolean
    description: 是否允许内核处理 IPv6 流量
    default: true
  - key: geox-url
    type: object
    properties:
      - key: geoip
        type: string
        description: GeoIP 数据文件下载地址
        default: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
      - key: geosite
        type: string
        description: GeoSite 数据文件下载地址
        default: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
      - key: mmdb
        type: string
        description: GeoIP MMDB 数据文件下载地址
        default: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb
    description: 自定义 GeoIP / GeoSite / MMDB 下载地址
    default:
      geoip: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
      geosite: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
      mmdb: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb
  - key: geo-auto-update
    type: boolean
    description: 是否自动更新 Geo 数据
    default: false
  - key: geo-update-interval
    type: number
    description: Geo 数据自动更新间隔（小时）
    default: 24
  - key: geosite-matcher
    type: string
    description: GeoSite 匹配器实现（succinct / mph）
    default: succinct
    enum:
      - succinct
      - mph
  - key: geodata-mode
    type: boolean
    description: GeoIP 数据格式（true 为 dat，false 为 mmdb）
    default: false
  - key: tls
    type: object
    properties:
      - key: certificate
        type: string
        description: TLS 证书（PEM 内容或文件路径）
        default: string
      - key: private-key
        type: string
        description: TLS 私钥（PEM 内容或文件路径）
        default: string
      - key: client-auth-type
        type: string
        description: TLS 客户端证书校验类型
        default: ""
      - key: client-auth-cert
        type: string
        description: TLS 客户端证书
        default: string
      - key: ech-key
        type: string
        description: TLS ECH 密钥（填写后启用 ECH）
        default: ""
      - key: custom-certifactes
        type: array
        items:
          type: string
        description: 额外信任的 TLS 证书列表
        default:
          - |
            -----BEGIN CERTIFICATE-----
            format/pem...
            -----END CERTIFICATE-----
    description: RESTful API HTTPS 使用的 TLS 配置
    default:
      certificate: string
      private-key: string
      custom-certifactes:
        - |
          -----BEGIN CERTIFICATE-----
          format/pem...
          -----END CERTIFICATE-----
  - key: external-controller
    type: string
    description: RESTful API 监听地址
    default: 0.0.0.0:9093
    rules: *a1
  - key: external-controller-tls
    type: string
    description: RESTful API HTTPS 监听地址
    default: 0.0.0.0:9443
    rules: *a1
  - key: secret
    type: string
    description: RESTful API 访问密钥
    default: "123456"
  - key: external-controller-cors
    type: object
    properties:
      - key: allow-origins
        type: array
        items:
          type: string
        description: CORS 允许的 Origin 列表
        default:
          - "*"
      - key: allow-private-network
        type: boolean
        description: 是否允许私有网络访问 CORS
        default: true
    description: RESTful API 的 CORS 配置
    default:
      allow-origins:
        - "*"
      allow-private-network: true
  - key: external-controller-unix
    type: string
    description: RESTful API Unix Socket 监听地址
    default: mihomo.sock
  - key: external-controller-pipe
    type: string
    description: RESTful API Windows 命名管道地址
    default: \\.\pipe\mihomo
  - key: external-doh-server
    type: string
    description: 在 API 端口上提供的 DoH 服务路径
    default: /dns-query
  - key: external-ui
    type: string
    description: 外部 Web UI 静态资源目录
    default: /path/to/ui/folder/
  - key: external-ui-name
    type: string
    description: 外部 Web UI 子目录名称
    default: xd
  - key: external-ui-url
    type: string
    description: 自定义外部用户界面下载地址
    default: https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip
  - key: tcp-concurrent
    type: boolean
    description: 启用 TCP 并发连接（使用 DNS 解析出的全部 IP）
    default: true
  - key: unified-delay
    type: boolean
    description: 统一延迟测速（消除不同节点握手差异）
    default: false
  - key: interface-name
    type: string
    description: 出站流量使用的网卡名称
    default: en0
  - key: routing-mark
    type: number
    description: Linux 出站连接的 fwmark 标记
    default: 6666
  - key: disable-keep-alive
    type: boolean
    description: 是否禁用 TCP Keep Alive
    default: false
  - key: keep-alive-idle
    type: number
    description: TCP Keep Alive 最大空闲时间（秒）
    default: 15
  - key: keep-alive-interval
    type: number
    description: TCP Keep Alive 探测间隔（秒）
    default: 15
  - key: global-client-fingerprint
    type: string
    description: 全局 TLS 客户端指纹（已弃用，建议在代理节点配置）
    default: chrome
    enum:
      - chrome
      - firefox
      - safari
      - ios
      - random
      - none
  - key: profile
    type: object
    properties:
      - key: store-selected
        type: boolean
        description: 是否保存策略组选择状态
        default: false
        enum:
          - true
          - false
      - key: store-fake-ip
        type: boolean
        description: 是否保存 Fake-IP 映射表
        default: true
        enum:
          - true
          - false
    description: 配置持久化选项
    default:
      store-selected: false
      store-fake-ip: true
  - key: hosts
    type: "null"
    description: 静态 Hosts 映射（类似 /etc/hosts）
    default: null
  - key: experimental
    type: object
    properties:
      - key: quic-go-disable-gso
        type: boolean
        description: 禁用 QUIC-go 的 GSO 优化
        default: true
    description: 实验性选项
    default: null
  - key: tun
    type: object
    properties:
      - key: enable
        type: boolean
        description: 是否启用 TUN
        default: false
      - key: stack
        type: string
        description: TUN 协议栈（system / gvisor / mixed）
        default: system
        enum:
          - system
          - gvisor
          - mixed
      - key: mtu
        type: number
        description: TUN 最大传输单元
        default: 9000
      - key: gso
        type: boolean
        description: 是否启用 GSO（仅 Linux）
        default: false
      - key: gso-max-size
        type: number
        description: GSO 数据块最大长度
        default: 65536
      - key: dns-hijack
        type: array
        items:
          type: string
        description: DNS 劫持地址列表
        default:
          - 0.0.0.0:53
      - key: auto-route
        type: boolean
        description: 是否自动设置全局路由
        default: true
      - key: auto-redirect
        type: boolean
        description: 是否自动重定向 TCP（Linux，需 auto-route）
        default: false
      - key: auto-detect-interface
        type: boolean
        description: 是否自动检测出站网卡
        default: true
      - key: strict-route
        type: boolean
        description: 启用 auto-route 时的严格路由
        default: true
      - key: endpoint-independent-nat
        type: boolean
        description: 是否启用独立于端点的 NAT
        default: false
      - key: route-address
        type: array
        items:
          type: string
        description: auto-route 时自定义路由网段
        default:
          - 0.0.0.0/1
          - 128.0.0.0/1
          - ::/1
          - 8000::/1
      - key: route-address-set
        type: array
        items:
          type: string
        description: 加入防火墙的路由规则集（不命中则绕过）
        default:
          - ruleset-1
          - ruleset-2
      - key: route-exclude-address-set
        type: array
        items:
          type: string
        description: 加入防火墙的排除规则集（命中则绕过）
        default:
          - ruleset-3
          - ruleset-4
      - key: disable-icmp-forwarding
        type: boolean
        description: 是否禁用 ICMP 转发
        default: true
    description: TUN 虚拟网卡入站
    default:
      enable: false
      stack: system
      dns-hijack:
        - 0.0.0.0:53
      auto-redirect: false
      route-address-set:
        - ruleset-1
        - ruleset-2
      route-exclude-address-set:
        - ruleset-3
        - ruleset-4
      route-address:
        - 0.0.0.0/1
        - 128.0.0.0/1
        - ::/1
        - 8000::/1
  - key: sniffer
    type: object
    properties:
      - key: enable
        type: boolean
        description: 是否启用域名嗅探
        default: false
      - key: force-dns-mapping
        type: boolean
        description: 对 redir-host 流量强制嗅探
        default: false
      - key: parse-pure-ip
        type: boolean
        description: 对未获取域名的流量强制嗅探
        default: false
      - key: override-destination
        type: boolean
        description: 是否用嗅探结果作为实际访问目标
        default: false
      - key: sniff
        type: object
        properties:
          - key: QUIC
            type: "null"
            default: null
          - key: ports
            type: array
            items:
              type: number
            default:
              - 443
          - key: TLS
            type: "null"
            default: null
          - key: HTTP
            type: object
            properties:
              - key: ports
                type: array
                items:
                  type: number
                default:
                  - 80
                  - 8080-8880
              - key: override-destination
                type: boolean
                default: true
                description: 是否覆盖连接目标
            default:
              ports:
                - 80
                - 8080-8880
              override-destination: true
        default:
          QUIC: null
          TLS: null
          HTTP:
            ports:
              - 80
              - 8080-8880
            override-destination: true
        description: 按协议的嗅探配置
      - key: force-domain
        type: array
        items:
          type: string
        description: 强制嗅探的域名列表
        default:
          - +.v2ex.com
      - key: port-whitelist
        type: array
        items:
          type: string
        default:
          - "80"
          - "443"
      - key: sniffing
        type: array
        items:
          type: string
        default:
          - tls
          - http
    description: 域名嗅探配置
    default:
      enable: false
      override-destination: false
      sniff:
        QUIC: null
        TLS: null
        HTTP:
          ports:
            - 80
            - 8080-8880
          override-destination: true
      force-domain:
        - +.v2ex.com
      sniffing:
        - tls
        - http
      port-whitelist:
        - "80"
        - "443"
  - key: dns
    type: object
    properties:
      - key: enable
        type: boolean
        description: 是否启用内置 DNS（关闭则使用系统 DNS）
        default: false
      - key: cache-algorithm
        type: string
        description: DNS 缓存算法（lru / arc）
        default: arc
        enum:
          - lru
          - arc
      - key: prefer-h3
        type: boolean
        description: DoH 是否优先使用 HTTP/3
        default: false
      - key: use-hosts
        type: boolean
        description: 是否使用配置中的 hosts 回应
        default: true
      - key: respect-rules
        type: boolean
        description: DNS 连接是否遵守路由规则
        default: false
      - key: listen
        type: string
        description: DNS 服务监听地址
        default: 0.0.0.0:53
      - key: ipv6
        type: boolean
        description: DNS 是否解析并回应 AAAA
        default: false
      - key: ipv6-timeout
        type: number
        description: IPv6 DNS 解析超时（秒）
        default: 300
      - key: default-nameserver
        type: array
        items:
          type: string
        description: 用于解析 DNS 服务器域名的 DNS（须为 IP）
        default:
          - system
          - 8.8.8.8
          - tls://1.12.12.12:853
          - tls://223.5.5.5:853
          - system
      - key: enhanced-mode
        type: string
        description: DNS 处理模式（fake-ip / redir-host）
        default: fake-ip
        enum:
          - fake-ip
          - redir-host
          - mapping
      - key: fake-ip-range
        type: string
        description: Fake-IP IPv4 地址池
        default: 198.18.0.1/16
      - key: fake-ip-range6
        type: string
        description: Fake-IP IPv6 地址池
        default: fdfe:dcba:9876::1/64
      - key: fake-ip-filter
        type: array
        items:
          type: string
        description: 不使用 Fake-IP 的域名或规则
        default:
          - "*.lan"
          - localhost.ptlogin2.qq.com
          - rule-set:fakeip-filter
          - geosite:fakeip-filter
          - RULE-SET,reject-domain,fake-ip
          - RULE-SET,proxy-domain,fake-ip
          - GEOSITE,gfw,fake-ip
          - DOMAIN,www.baidu.com,real-ip
          - DOMAIN-SUFFIX,qq.com,real-ip
          - DOMAIN-SUFFIX,jd.com,fake-ip
          - MATCH,fake-ip
      - key: fake-ip-filter-mode
        type: string
        description: Fake-IP 过滤模式（blacklist / whitelist / rule）
        default: blacklist
        enum:
          - blacklist
          - whitelist
          - rule
      - key: fake-ip-ttl
        type: number
        description: Fake-IP 查询结果的 TTL
        default: 1
      - key: nameserver-policy
        type: object
        properties:
          - key: geosite:category-ads-all
            type: string
            default: rcode://success
          - key: geosite:cn,private,apple
            type: array
            items:
              type: string
            default:
              - https://doh.pub/dns-query
              - https://dns.alidns.com/dns-query
          - key: www
            type: object
            properties:
              - key: baidu
                type: object
                properties:
                  - key: com,+
                    type: object
                    properties:
                      - key: google
                        type: object
                        properties:
                          - key: cn
                            type: array
                            items:
                              type: string
                            default:
                              - 223.5.5.5
                              - https://dns.alidns.com/dns-query
        description: 指定域名使用的 DNS 服务器
        default:
          geosite:cn,private,apple:
            - https://doh.pub/dns-query
            - https://dns.alidns.com/dns-query
          geosite:category-ads-all: rcode://success
          www.baidu.com,+.google.cn:
            - 223.5.5.5
            - https://dns.alidns.com/dns-query
      - key: nameserver
        type: array
        items:
          type: string
        description: 默认域名解析服务器列表
        default:
          - 8.8.8.8
          - 8.8.8.8
          - tls://223.5.5.5:853
          - https://doh.pub/dns-query
          - https://dns.alidns.com/dns-query#h3=true
          - https://mozilla.cloudflare-dns.com/dns-query#DNS&h3=true
          - dhcp://en0
          - quic://dns.adguard.com:784
      - key: fallback
        type: array
        items:
          type: string
        description: 后备域名解析服务器（通常用于境外 DNS）
        default:
          - https://dns.google/dns-query
          - https://cloudflare-dns.com/dns-query
          - 1.1.1.1
          - 8.8.8.8
      - key: fallback-filter
        type: object
        properties:
          - key: geoip
            type: boolean
            description: 是否用 GeoIP 判断污染
            default: true
          - key: geoip-code
            type: string
            description: 视为可信的国家代码
            default: CN
          - key: geosite
            type: array
            items:
              type: string
            description: 视为污染的 GeoSite 列表
            default:
              - gfw
          - key: ipcidr
            type: array
            items:
              type: string
            description: 视为污染的 IP 段
            default:
              - 240.0.0.0/4
          - key: domain
            type: array
            items:
              type: string
            description: 视为污染的域名列表
            default:
              - +.google.com
              - +.facebook.com
              - +.youtube.com
        description: 后备 DNS 结果筛选条件
        default:
          geoip: true
          geoip-code: CN
          geosite:
            - gfw
          ipcidr:
            - 240.0.0.0/4
          domain:
            - +.google.com
            - +.facebook.com
            - +.youtube.com
      - key: proxy-server-nameserver
        type: array
        items:
          type: string
        description: 仅用于解析代理节点域名的 DNS
        default:
          - https://doh.pub/dns-query
          - https://dns.alidns.com/dns-query
          - 119.29.29.29
          - 223.5.5.5
      - key: direct-nameserver-follow-policy
        type: boolean
        description: 直连 DNS 是否遵守 nameserver-policy
        default: false
      - key: geoip
        type: boolean
        description: DNS 模块内 GeoIP 开关（fallback-filter 子项）
        default: true
      - key: geoip-code
        type: string
        description: DNS 模块内 GeoIP 国家代码
        default: CN
    description: DNS 模块配置
    default:
      cache-algorithm: arc
      enable: false
      prefer-h3: false
      listen: 0.0.0.0:53
      default-nameserver:
        - 114.114.114.114
        - 8.8.8.8
        - tls://1.12.12.12:853
        - tls://223.5.5.5:853
        - system
      enhanced-mode: fake-ip
      fake-ip-range: 198.18.0.1/16
      fake-ip-filter:
        - "*.lan"
        - localhost.ptlogin2.qq.com
        - rule-set:fakeip-filter
        - geosite:fakeip-filter
        - RULE-SET,reject-domain,fake-ip
        - RULE-SET,proxy-domain,fake-ip
        - GEOSITE,gfw,fake-ip
        - DOMAIN,www.baidu.com,real-ip
        - DOMAIN-SUFFIX,qq.com,real-ip
        - DOMAIN-SUFFIX,jd.com,fake-ip
        - MATCH,fake-ip
      fake-ip-filter-mode: blacklist
      fake-ip-ttl: 1
      respect-rules: false
      nameserver:
        - 114.114.114.114
        - 8.8.8.8
        - tls://223.5.5.5:853
        - https://doh.pub/dns-query
        - https://dns.alidns.com/dns-query#h3=true
        - https://mozilla.cloudflare-dns.com/dns-query#DNS&h3=true
        - dhcp://en0
        - quic://dns.adguard.com:784
      nameserver-policy:
        geosite:cn,private,apple:
          - https://doh.pub/dns-query
          - https://dns.alidns.com/dns-query
        geosite:category-ads-all: rcode://success
        www.baidu.com,+.google.cn:
          - 223.5.5.5
          - https://dns.alidns.com/dns-query
  - key: ntp
    type: object
    properties:
      - key: enable
        type: boolean
        description: 是否启用 NTP 服务
        default: true
      - key: write-to-system
        type: boolean
        description: 是否同步至系统时间（需 root 或管理员权限）
        default: true
      - key: server
        type: string
        description: NTP 服务地址
        default: time.apple.com
      - key: port
        type: number
        description: NTP 服务端口
        default: 123
        rules: *a1
      - key: interval
        type: number
        description: 同步时间间隔（分钟）
        default: 30
    description: NTP 时间同步配置
    default:
      enable: true
      write-to-system: true
      server: time.apple.com
      port: 123
